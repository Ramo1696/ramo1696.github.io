<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Profit</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="exchange-rate.js"></script>
</head>
<body>
  <div id="container">
    <h1>P2P Profit</h1>

    <div class="form-group">
      <label>Криптовалюта</label>
      <select id="crypto">
        <option value="tether">USDT</option>
        <option value="usd-coin">USDC</option>
        <option value="bitcoin">BTC</option>
        <option value="ethereum">ETH</option>
      </select>
    </div>

    <div class="form-group">
      <label>Фиат</label>
      <select id="fiat">
        <option value="gel">GEL</option>
        <option value="usd">USD</option>
        <option value="eur">EUR</option>
        <option value="rub">RUB</option>
      </select>
    </div>

    <div class="form-group">
      <label>Сумма (в криптовалюте)</label>
      <input type="number" id="amount" placeholder="например, 1000" />
    </div>

    <div class="form-row">
      <div class="form-group half">
        <label>Курс покупки</label>
        <input type="number" id="buyRate" />
      </div>
      <div class="form-group half">
        <label>Курс продажи</label>
        <input type="number" id="sellRate" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group half">
        <label>Комиссия покупки (%)</label>
        <input type="number" id="buyFee" value="0" />
      </div>
      <div class="form-group half">
        <label>Комиссия продажи (%)</label>
        <input type="number" id="sellFee" value="0" />
      </div>
    </div>

    <div class="form-group checkbox-row">
      <input type="checkbox" id="autoRate" />
      <label for="autoRate">Автоматический курс</label>
    </div>

    <button onclick="calculate()">Рассчитать</button>
    <div class="ad-banner">Реклама от Google</div>

    <div id="result" class="result">
      <p>Курс покупки: <span id="r-buy">-</span></p>
      <p>Курс продажи: <span id="r-sell">-</span></p>
      <p>Спред без комиссии: <span id="r-spread">-</span></p>
      <p>Спред с комиссией: <span id="r-spread-fee">-</span></p>
      <p>Потрачено: <span id="r-spent">-</span></p>
      <p>Получено: <span id="r-received">-</span></p>
      <p>Чистая прибыль: <span id="r-profit">-</span></p>
    </div>
  </div>
</body>
</html>
