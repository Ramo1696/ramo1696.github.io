<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Profit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <h1>P2P Profit</h1>

    <div class="form-group">
      <label for="crypto">Криптовалюта</label>
      <select id="crypto">
        <option value="tether">USDT</option>
        <option value="usd-coin">USDC</option>
        <option value="bitcoin">BTC</option>
        <option value="ethereum">ETH</option>
      </select>
    </div>

    <div class="form-group">
      <label for="fiat">Фиат</label>
      <select id="fiat">
        <option value="gel">GEL</option>
        <option value="usd">USD</option>
        <option value="eur">EUR</option>
        <option value="rub">RUB</option>
      </select>
    </div>

    <div class="form-group">
      <label for="amount">Сумма (в криптовалюте)</label>
      <input id="amount" type="number" placeholder="например, 1000" />
    </div>

    <div class="form-group inline-checkbox">
      <input id="auto-rate" type="checkbox" />
      <label for="auto-rate">Автоматический курс</label>
    </div>

    <div class="form-group group-inline">
      <div>
        <label for="buy-rate">Курс покупки</label>
        <input id="buy-rate" type="number" step="any" />
      </div>
      <div>
        <label for="sell-rate">Курс продажи</label>
        <input id="sell-rate" type="number" step="any" />
      </div>
    </div>

    <div class="form-group group-inline">
      <div>
        <label for="buy-fee">Комиссия покупки (%)</label>
        <input id="buy-fee" type="number" step="any" value="0" />
      </div>
      <div>
        <label for="sell-fee">Комиссия продажи (%)</label>
        <input id="sell-fee" type="number" step="any" value="0" />
      </div>
    </div>

    <button onclick="calculateProfit()">Рассчитать</button>

    <div class="banner">
      Реклама от Google
    </div>

    <div id="result">
      <p>Курс покупки: <span id="display-buy-rate">-</span></p>
      <p>Курс продажи: <span id="display-sell-rate">-</span></p>
      <p>Спред без комиссии: <span id="display-spread">-</span></p>
      <p>Спред с комиссией: <span id="display-net-spread">-</span></p>
      <p>Потрачено: <span id="spent">-</span></p>
      <p>Получено: <span id="received">-</span></p>
      <p>Чистая прибыль: <span id="profit">-</span></p>
    </div>
  </div>

  <script src="exchange-rate.js"></script>
</body>
</html>
