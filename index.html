<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Profit</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="exchange-rate.js"></script>
</head>
<body>
  <div class="top-bar">
    <button id="themeToggle" class="icon-btn">☀️</button>
    <button id="langToggle" class="lang-btn">Eng</button>
  </div>

  <div id="container">
    <h1>P2P Profit</h1>

    <div class="form-group">
      <label id="cryptoLabel">Криптовалюта</label>
      <select id="crypto">
        <option value="tether">USDT</option>
        <option value="usd-coin">USDC</option>
        <option value="bitcoin">BTC</option>
        <option value="ethereum">ETH</option>
      </select>
    </div>

    <div class="form-group">
      <label id="fiatLabel">Фиат</label>
      <select id="fiat">
        <option value="gel">GEL</option>
        <option value="usd">USD</option>
        <option value="eur">EUR</option>
        <option value="rub">RUB</option>
      </select>
    </div>

    <div class="form-group">
      <label id="amountLabel">Сумма (в криптовалюте)</label>
      <input type="number" id="amount" placeholder="например, 1000" />
    </div>

    <div class="form-group">
      <label id="buyRateLabel">Курс покупки</label>
      <input type="number" id="buyRate" step="any" />
    </div>

    <div class="form-group">
      <label id="sellRateLabel">Курс продажи</label>
      <input type="number" id="sellRate" step="any" />
    </div>

    <div class="form-group">
      <label id="buyFeeLabel">Комиссия покупки (%)</label>
      <input type="number" id="buyFee" step="any" value="0" />
    </div>

    <div class="form-group">
      <label id="sellFeeLabel">Комиссия продажи (%)</label>
      <input type="number" id="sellFee" step="any" value="0" />
    </div>

    <div class="form-group checkbox-group">
      <input type="checkbox" id="autoRate" />
      <label for="autoRate" id="autoRateLabel">Автоматический курс</label>
    </div>

    <button id="calculateBtn">Рассчитать</button>

    <div id="result"></div>

    <div class="ad-banner">
      <strong>Реклама от Google</strong><br />
      Благодаря рекламе приложение остаётся бесплатным
    </div>
  </div>
</body>
</html>
