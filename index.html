<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>P2P Profit</title>
  <link rel="stylesheet" href="style.css"/>
  <script defer src="exchange-rate.js"></script>
</head>
<body>
  <div class="container">
    <h1>P2P Profit</h1>

    <div class="form-group">
      <label>Криптовалюта</label>
      <select id="crypto">
        <option value="tether">USDT</option>
        <option value="usd-coin">USDC</option>
        <option value="bitcoin">BTC</option>
        <option value="ethereum">ETH</option>
      </select>
    </div>

    <div class="form-group">
      <label>Фиат</label>
      <select id="fiat">
        <option value="gel">GEL</option>
        <option value="usd">USD</option>
        <option value="eur">EUR</option>
        <option value="rub">RUB</option>
      </select>
    </div>

    <div class="form-group">
      <label>Сумма (в криптовалюте)</label>
      <input type="number" id="amount" placeholder="например, 1000"/>
    </div>

    <div class="auto-rate">
      <input type="checkbox" id="autoRate"/>
      <label for="autoRate">Автоматический курс</label>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Курс покупки</label>
        <input type="number" id="buyRate" />
      </div>
      <div class="form-group">
        <label>Курс продажи</label>
        <input type="number" id="sellRate" />
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Комиссия покупки (%)</label>
        <input type="number" id="buyFee" value="0"/>
      </div>
      <div class="form-group">
        <label>Комиссия продажи (%)</label>
        <input type="number" id="sellFee" value="0"/>
      </div>
    </div>

    <button onclick="calculate()">Рассчитать</button>

    <div class="ad-banner">Реклама от Google<br><small>Благодаря рекламе приложение остаётся бесплатным</small></div>

    <div class="result">
      <p id="r1">Курс покупки: -</p>
      <p id="r2">Курс продажи: -</p>
      <p id="r3">Спред без комиссии: -</p>
      <p id="r4">Спред с комиссией: -</p>
      <p id="r5">Потрачено: -</p>
      <p id="r6">Получено: -</p>
      <p id="r7">Чистая прибыль: -</p>
    </div>
  </div>
</body>
</html>
