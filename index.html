<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Profit</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="exchange-rate.js"></script>
</head>
<body>
  <div id="container">
    <h1>P2P Profit</h1>

    <div class="form-group">
      <label>Криптовалюта</label>
      <select id="crypto">
        <option value="tether">USDT</option>
        <option value="usd-coin">USDC</option>
        <option value="bitcoin">BTC</option>
        <option value="ethereum">ETH</option>
      </select>
    </div>

    <div class="form-group">
      <label>Фиат</label>
      <select id="fiat">
        <option value="gel">GEL</option>
        <option value="usd">USD</option>
        <option value="eur">EUR</option>
        <option value="rub">RUB</option>
      </select>
    </div>

    <div class="form-group">
      <label>Сумма (в криптовалюте)</label>
      <input type="number" id="amount" placeholder="например, 1000" />
    </div>

    <div class="form-group auto-rate">
      <label><input type="checkbox" id="autoRate" /> Автоматический курс</label>
    </div>

    <div class="form-group-row">
      <div class="form-group-half">
        <label for="buyRate">Курс покупки</label>
        <input type="number" id="buyRate" />
      </div>
      <div class="form-group-half">
        <label for="sellRate">Курс продажи</label>
        <input type="number" id="sellRate" />
      </div>
    </div>

    <div class="form-group-row">
      <div class="form-group-half">
        <label for="buyFee">Комиссия покупки (%)</label>
        <input type="number" id="buyFee" value="0" />
      </div>
      <div class="form-group-half">
        <label for="sellFee">Комиссия продажи (%)</label>
        <input type="number" id="sellFee" value="0" />
      </div>
    </div>

    <button id="calculateBtn">Рассчитать</button>

    <div id="banner">Реклама от Google</div>

    <div id="result">
      <p>Курс покупки: <span id="buyRateResult">-</span></p>
      <p>Курс продажи: <span id="sellRateResult">-</span></p>
      <p>Спред без комиссии: <span id="spreadNoFee">-</span></p>
      <p>Спред с комиссией: <span id="spreadWithFee">-</span></p>
      <p>Потрачено: <span id="spent">-</span></p>
      <p>Получено: <span id="received">-</span></p>
      <p>Чистая прибыль: <span id="netProfit">-</span></p>
    </div>
  </div>
</body>
</html>
