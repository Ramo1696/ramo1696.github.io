<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Profit</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="exchange-rate.js"></script>
</head>
<body>
  <div id="container">
    <h1>P2P Profit</h1>

    <div class="form-group">
      <label>Криптовалюта</label>
      <select id="crypto">
        <option value="tether">USDT</option>
        <option value="usd-coin">USDC</option>
        <option value="bitcoin">BTC</option>
        <option value="ethereum">ETH</option>
      </select>
    </div>

    <div class="form-group">
      <label>Фиат</label>
      <select id="fiat">
        <option value="gel">GEL</option>
        <option value="usd">USD</option>
        <option value="eur">EUR</option>
        <option value="rub">RUB</option>
      </select>
    </div>

    <div class="form-group">
      <label>Сумма (в криптовалюте)</label>
      <input type="number" id="amount" placeholder="например, 1000" />
    </div>

    <div class="form-group dual">
      <div>
        <label>Курс покупки</label>
        <input type="number" id="buyRate" />
      </div>
      <div>
        <label>Курс продажи</label>
        <input type="number" id="sellRate" />
      </div>
    </div>

    <div class="form-group dual">
      <div>
        <label>Комиссия покупки (%)</label>
        <input type="number" id="buyFee" value="0" />
      </div>
      <div>
        <label>Комиссия продажи (%)</label>
        <input type="number" id="sellFee" value="0" />
      </div>
    </div>

    <div class="form-group inline-check">
      <input type="checkbox" id="autoRate" />
      <label for="autoRate">Автоматический курс</label>
    </div>

    <button onclick="calculate()">Рассчитать</button>

    <div class="ad-banner">Реклама от Google<br><span>Благодаря рекламе приложение остаётся бесплатным</span></div>

    <div id="result" class="result-box">
      <p id="resultBuyRate">Курс покупки: -</p>
      <p id="resultSellRate">Курс продажи: -</p>
      <p id="resultSpreadRaw">Спред без комиссии: - %</p>
      <p id="resultSpreadWithFees">Спред с комиссией: - %</p>
      <p id="resultSpent">Потрачено: -</p>
      <p id="resultReceived">Получено: -</p>
      <p id="resultProfit">Чистая прибыль: -</p>
    </div>
  </div>
</body>
</html>
