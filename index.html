<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2P Profit</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="exchange-rate.js"></script>
</head>
<body>
  <div id="container">
    <h1>P2P Profit</h1>

    <div class="form-group">
      <label>Криптовалюта</label>
      <select id="crypto">
        <option value="tether">USDT</option>
        <option value="usd-coin">USDC</option>
        <option value="bitcoin">BTC</option>
        <option value="ethereum">ETH</option>
      </select>
    </div>

    <div class="form-group">
      <label>Фиат</label>
      <select id="fiat">
        <option value="gel">GEL</option>
        <option value="usd">USD</option>
        <option value="eur">EUR</option>
        <option value="rub">RUB</option>
      </select>
    </div>

    <div class="form-group">
      <label>Сумма (в криптовалюте)</label>
      <input type="number" id="amount" placeholder="например, 1000">
    </div>

    <div class="rate-row">
      <div class="form-group">
        <label>Курс покупки</label>
        <input type="number" id="buyRate">
      </div>
      <div class="form-group">
        <label>Курс продажи</label>
        <input type="number" id="sellRate">
      </div>
    </div>

    <div class="rate-row">
      <div class="form-group">
        <label>Комиссия покупки (%)</label>
        <input type="number" id="buyFee" value="0">
      </div>
      <div class="form-group">
        <label>Комиссия продажи (%)</label>
        <input type="number" id="sellFee" value="0">
      </div>
    </div>

    <div class="form-group checkbox">
      <input type="checkbox" id="autoRate">
      <label for="autoRate">Автоматический курс</label>
    </div>

    <button onclick="calculateProfit()">Рассчитать</button>

    <div class="ad-banner">Реклама от Google</div>

    <div class="results">
      <p id="buyRateOutput">Курс покупки: -</p>
      <p id="sellRateOutput">Курс продажи: -</p>
      <p id="spreadOutput">Спред без комиссии: - %</p>
      <p id="spreadWithFeeOutput">Спред с комиссией: - %</p>
      <p id="spentOutput">Потрачено: -</p>
      <p id="receivedOutput">Получено: -</p>
      <p id="netProfitOutput">Чистая прибыль: -</p>
    </div>
  </div>
</body>
</html>
