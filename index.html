<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Profit</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="exchange-rate.js"></script>
</head>
<body>
  <div id="container">
    <button id="languageToggle" onclick="toggleLanguage()">ENG</button>
    <h1 id="title" data-i18n="title">P2P Profit</h1>

    <label for="crypto" data-i18n="crypto">Криптовалюта</label>
    <select id="crypto">
      <option value="tether">USDT</option>
      <option value="usd-coin">USDC</option>
      <option value="bitcoin">BTC</option>
      <option value="ethereum">ETH</option>
    </select>

    <label for="fiat" data-i18n="fiat">Фиат</label>
    <select id="fiat">
      <option value="gel">GEL</option>
      <option value="usd">USD</option>
      <option value="eur">EUR</option>
      <option value="rub">RUB</option>
    </select>

    <label data-i18n="amount">Сумма (в криптовалюте)</label>
    <input id="amount" placeholder="например, 1000" />

    <label data-i18n="buyRate">Курс покупки</label>
    <input id="buyRate" />

    <label data-i18n="sellRate">Курс продажи</label>
    <input id="sellRate" />

    <label data-i18n="buyFee">Комиссия покупки (%)</label>
    <input id="buyFee" value="0" />

    <label data-i18n="sellFee">Комиссия продажи (%)</label>
    <input id="sellFee" value="0" />

    <label><input type="checkbox" id="autoRate" /> <span data-i18n="autoRate">Автоматический курс</span></label>

    <button id="calculate" data-i18n="calculate">Рассчитать</button>

    <div id="result"></div>
  </div>

  <script>
    const translations = {
      en: {
        title: "P2P Profit",
        crypto: "Cryptocurrency",
        fiat: "Fiat",
        amount: "Amount (in crypto)",
        buyRate: "Buy Rate",
        sellRate: "Sell Rate",
        buyFee: "Buy Fee (%)",
        sellFee: "Sell Fee (%)",
        autoRate: "Automatic Rate",
        calculate: "Calculate"
      },
      ru: {
        title: "P2P Profit",
        crypto: "Криптовалюта",
        fiat: "Фиат",
        amount: "Сумма (в криптовалюте)",
        buyRate: "Курс покупки",
        sellRate: "Курс продажи",
        buyFee: "Комиссия покупки (%)",
        sellFee: "Комиссия продажи (%)",
        autoRate: "Автоматический курс",
        calculate: "Рассчитать"
      }
    };

    let currentLang = 'ru';

    function toggleLanguage() {
      currentLang = currentLang === 'ru' ? 'en' : 'ru';
      document.getElementById("languageToggle").textContent = currentLang === 'ru' ? 'ENG' : 'RUS';

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (translations[currentLang][key]) {
          el.textContent = translations[currentLang][key];
        }
      });
    }
  </script>
</body>
</html>
