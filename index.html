<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Profit</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="exchange-rate.js"></script>
</head>
<body class="dark">
  <header>
    <button id="themeToggle" class="icon-button">☀️</button>
    <button id="langToggle" class="lang-button">Eng</button>
  </header>

  <div id="container">
    <h1>P2P Profit</h1>

    <div class="form-group">
      <label id="label-crypto">Криптовалюта</label>
      <select id="crypto">
        <option value="tether">USDT</option>
        <option value="usd-coin">USDC</option>
        <option value="bitcoin">BTC</option>
        <option value="ethereum">ETH</option>
      </select>
    </div>

    <div class="form-group">
      <label id="label-fiat">Фиат</label>
      <select id="fiat">
        <option value="gel">GEL</option>
        <option value="usd">USD</option>
        <option value="eur">EUR</option>
        <option value="rub">RUB</option>
      </select>
    </div>

    <div class="form-group">
      <label id="label-amount">Сумма (в криптовалюте)</label>
      <input type="number" id="amount" placeholder="например, 1000" />
    </div>

    <div class="form-group">
      <label id="label-buy">Курс покупки</label>
      <input type="number" id="buyRate" />
    </div>

    <div class="form-group">
      <label id="label-sell">Курс продажи</label>
      <input type="number" id="sellRate" />
    </div>

    <div class="form-group">
      <label id="label-buy-fee">Комиссия покупки (%)</label>
      <input type="number" id="buyFee" value="0" />
    </div>

    <div class="form-group">
      <label id="label-sell-fee">Комиссия продажи (%)</label>
      <input type="number" id="sellFee" value="0" />
    </div>

    <div class="form-group">
      <label><input type="checkbox" id="autoRate" /> <span id="label-auto">Автоматический курс</span></label>
    </div>

    <button id="calculate" class="primary-button">Рассчитать</button>

    <div id="result"></div>
    <div id="ad">Реклама от Google<br>Благодаря рекламе приложение остаётся бесплатным</div>
  </div>
</body>
</html>
