<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Profit</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="exchange-rate.js"></script>
</head>
<body>
  <div id="splash-screen">
    <img src="https://upload.wikimedia.org/wikipedia/commons/9/9a/Bitcoin_Logo.svg" alt="Logo" class="splash-logo">
    <h1>P2P Profit</h1>
  </div>

  <div id="container" class="hidden">
    <div class="header">
      <button id="theme-toggle">🌞</button>
      <h1 id="title">P2P Profit</h1>
      <button id="lang-toggle">Eng</button>
    </div>

    <label>Криптовалюта</label>
    <select id="crypto">
      <option value="tether">USDT</option>
      <option value="usd-coin">USDC</option>
      <option value="bitcoin">BTC</option>
      <option value="ethereum">ETH</option>
    </select>

    <label>Фиат</label>
    <select id="fiat">
      <option value="gel">GEL</option>
      <option value="usd">USD</option>
      <option value="eur">EUR</option>
      <option value="rub">RUB</option>
    </select>

    <label>Сумма (в криптовалюте)</label>
    <input type="number" id="amount" placeholder="например, 1000" />

    <label>Курс покупки</label>
    <input type="number" id="buyRate" />

    <label>Курс продажи</label>
    <input type="number" id="sellRate" />

    <label>Комиссия покупки (%)</label>
    <input type="number" id="buyFee" value="0" />

    <label>Комиссия продажи (%)</label>
    <input type="number" id="sellFee" value="0" />

    <label><input type="checkbox" id="autoRate" /> Автоматический курс</label>

    <button id="calculate">Рассчитать</button>
    <div id="result"></div>
  </div>
</body>
</html>
