<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Profit</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="exchange-rate.js"></script>
</head>
<body>
  <div class="top-bar">
    <button id="theme-toggle" title="Сменить тему">🌞</button>
    <button id="lang-toggle" title="Сменить язык">Eng</button>
  </div>

  <h1>P2P Profit</h1>

  <div class="form-group">
    <label id="crypto-label">Криптовалюта</label>
    <select id="crypto">
      <option value="tether">USDT</option>
      <option value="usd-coin">USDC</option>
      <option value="bitcoin">BTC</option>
      <option value="ethereum">ETH</option>
    </select>
  </div>

  <div class="form-group">
    <label id="fiat-label">Фиат</label>
    <select id="fiat">
      <option value="gel">GEL</option>
      <option value="usd">USD</option>
      <option value="eur">EUR</option>
      <option value="rub">RUB</option>
    </select>
  </div>

  <div class="form-group">
    <label id="amount-label">Сумма (в криптовалюте)</label>
    <input type="number" id="amount" placeholder="например, 1000" />
  </div>

  <div class="form-group">
    <label id="buy-rate-label">Курс покупки</label>
    <input type="number" id="buy-rate" />
  </div>

  <div class="form-group">
    <label id="sell-rate-label">Курс продажи</label>
    <input type="number" id="sell-rate" />
  </div>

  <div class="form-group">
    <label id="buy-fee-label">Комиссия покупки (%)</label>
    <input type="number" id="buy-fee" value="0" />
  </div>

  <div class="form-group">
    <label id="sell-fee-label">Комиссия продажи (%)</label>
    <input type="number" id="sell-fee" value="0" />
  </div>

  <div class="form-group checkbox">
    <input type="checkbox" id="auto-rate" />
    <label for="auto-rate" id="auto-rate-label">Автоматический курс</label>
  </div>

  <button id="calculate-button">Рассчитать</button>

  <div class="results" id="results"></div>

  <div class="ads">
    <p>Реклама от Google</p>
    <p>Благодаря рекламе приложение остаётся бесплатным</p>
  </div>
</body>
</html>
