<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Profit</title>

  <!-- Подключение manifest.json для PWA -->
  <link rel="manifest" href="/manifest.json">

  <!-- Иконка сайта -->
  <link rel="icon" type="image/png" href="/android-launchericon-512-512.png">

  <!-- Стили -->
  <link rel="stylesheet" href="style.css" />

  <!-- Скрипты -->
  <script defer src="exchange-rate.js"></script>
</head>
<body>
  <div id="container">
    <h1>P2P Profit</h1>

    <div class="form-group">
      <label>Криптовалюта</label>
      <select id="crypto">
        <option value="tether">USDT</option>
        <option value="usd-coin">USDC</option>
        <option value="bitcoin">BTC</option>
        <option value="ethereum">ETH</option>
      </select>
    </div>

    <div class="form-group">
      <label>Фиат</label>
      <select id="fiat">
        <option value="gel">GEL</option>
        <option value="usd">USD</option>
        <option value="rub">RUB</option>
        <option value="eur">EUR</option>
      </select>
    </div>

    <div class="form-group">
      <label>Сумма (в криптовалюте)</label>
      <input type="number" id="amount" placeholder="например, 1000" />
    </div>

    <div class="form-group toggle">
      <label><input type="checkbox" id="autoToggle" checked> Автоматический курс</label>
    </div>

    <div class="form-group-row">
      <div>
        <label>Курс покупки</label>
        <input type="number" id="buyRate" disabled />
      </div>
      <div>
        <label>Курс продажи</label>
        <input type="number" id="sellRate" disabled />
      </div>
    </div>

    <div class="form-group-row">
      <div>
        <label>Комиссия покупки (%)</label>
        <input type="number" id="buyFee" placeholder="0" />
      </div>
      <div>
        <label>Комиссия продажи (%)</label>
        <input type="number" id="sellFee" placeholder="0" />
      </div>
    </div>

    <button onclick="calculate()">Рассчитать</button>

    <div id="result-card">
      <p><strong>Курс покупки:</strong> <span id="resBuyRate">-</span></p>
      <p><strong>Курс продажи:</strong> <span id="resSellRate">-</span></p>
      <p><strong>Спред без комиссии:</strong> <span id="spreadRaw">-</span></p>
      <p><strong>Спред с комиссией:</strong> <span id="spreadNet">-</span></p>
      <p><strong>Потрачено:</strong> <span id="spent">-</span></p>
      <p><strong>Получено:</strong> <span id="received">-</span></p>
      <p><strong>Чистая прибыль:</strong> <span id="netProfit" class="profit">-</span></p>
    </div>
  </div>
</body>
</html>
