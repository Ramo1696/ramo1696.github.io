<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Profit</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="exchange-rate.js"></script>
</head>
<body>
  <!-- Кнопки темы и языка -->
  <div class="ui-buttons">
    <button id="themeToggle">☀️</button>
    <button id="langToggle">Eng</button>
  </div>

  <div id="container">
    <h1>P2P Profit</h1>

    <div class="form-group">
      <label id="crypto">Криптовалюта</label>
      <select id="cryptoSelect">
        <option value="tether">USDT</option>
        <option value="usd-coin">USDC</option>
        <option value="bitcoin">BTC</option>
        <option value="ethereum">ETH</option>
      </select>
    </div>

    <div class="form-group">
      <label id="fiat">Фиат</label>
      <select id="fiatSelect">
        <option value="gel">GEL</option>
        <option value="usd">USD</option>
        <option value="eur">EUR</option>
        <option value="rub">RUB</option>
      </select>
    </div>

    <div class="form-group">
      <label id="sum">Сумма (в криптовалюте)</label>
      <input type="number" id="amount" placeholder="например, 1000" />
    </div>

    <div class="form-group">
      <label id="buyRate">Курс покупки</label>
      <input type="number" id="buyRateInput" step="any" />
    </div>

    <div class="form-group">
      <label id="sellRate">Курс продажи</label>
      <input type="number" id="sellRateInput" step="any" />
    </div>

    <div class="form-group">
      <label id="buyFee">Комиссия покупки (%)</label>
      <input type="number" id="buyFeeInput" value="0" />
    </div>

    <div class="form-group">
      <label id="sellFee">Комиссия продажи (%)</label>
      <input type="number" id="sellFeeInput" value="0" />
    </div>

    <div class="form-group auto-rate">
      <label><input type="checkbox" id="autoRate" /> <span id="autoRateText">Автоматический курс</span></label>
    </div>

    <button id="calculate">Рассчитать</button>

    <div class="ad-banner">Реклама от Google<br><small>Благодаря рекламе приложение остаётся бесплатным</small></div>

    <div id="results" class="results-box"></div>
  </div>
</body>
</html>
