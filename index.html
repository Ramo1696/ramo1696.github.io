<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Profit</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="exchange-rate.js"></script>
</head>
<body>
  <div id="container">
    <h1>P2P Profit</h1>

    <div class="form-group">
      <label>Криптовалюта</label>
      <select id="crypto">
        <option value="tether">USDT</option>
        <option value="usd-coin">USDC</option>
        <option value="bitcoin">BTC</option>
        <option value="ethereum">ETH</option>
      </select>
    </div>

    <div class="form-group">
      <label>Фиат</label>
      <select id="fiat">
        <option value="gel">GEL</option>
        <option value="usd">USD</option>
        <option value="eur">EUR</option>
        <option value="rub">RUB</option>
      </select>
    </div>

    <div class="form-group">
      <label>Сумма (в криптовалюте)</label>
      <input type="number" id="amount" placeholder="например, 1000" />
    </div>

    <div class="form-group dual-column">
      <div>
        <label>Курс покупки</label>
        <input type="number" id="buyRate" />
      </div>
      <div>
        <label>Курс продажи</label>
        <input type="number" id="sellRate" />
      </div>
    </div>

    <div class="form-group dual-column">
      <div>
        <label>Комиссия покупки (%)</label>
        <input type="number" id="buyFee" />
      </div>
      <div>
        <label>Комиссия продажи (%)</label>
        <input type="number" id="sellFee" />
      </div>
    </div>

    <div class="form-group auto-rate">
      <label><input type="checkbox" id="autoRate" /> Автоматический курс</label>
    </div>

    <button onclick="calculate()">Рассчитать</button>

    <div class="ad">Реклама от Google<br><small>Благодаря рекламе приложение остаётся бесплатным</small></div>

    <div id="result">
      <p id="buyRateText"></p>
      <p id="sellRateText"></p>
      <p id="spreadText"></p>
      <p id="spreadWithFeesText"></p>
      <p id="spentText"></p>
      <p id="receivedText"></p>
      <p id="profitText"></p>
    </div>
  </div>
</body>
</html>
