<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Profit</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="exchange-rate.js"></script>
</head>
<body>
  <div id="container">
    <h1>P2P Profit</h1>

    <div class="form-group">
      <label>Криптовалюта</label>
      <select id="crypto">
        <option value="tether">USDT</option>
        <option value="usd-coin">USDC</option>
        <option value="bitcoin">BTC</option>
        <option value="ethereum">ETH</option>
      </select>
    </div>

    <div class="form-group">
      <label>Фиат</label>
      <select id="fiat">
        <option value="gel">GEL</option>
        <option value="usd">USD</option>
        <option value="eur">EUR</option>
        <option value="rub">RUB</option>
      </select>
    </div>

    <div class="form-group">
      <label>Сумма (в криптовалюте)</label>
      <input type="number" id="amount" placeholder="например, 1000" />
    </div>

    <div class="form-group row">
      <div>
        <label>Курс покупки</label>
        <input type="number" id="buyRate" />
      </div>
      <div>
        <label>Курс продажи</label>
        <input type="number" id="sellRate" />
      </div>
    </div>

    <div class="form-group row">
      <div>
        <label>Комиссия покупки (%)</label>
        <input type="number" id="buyFee" value="0" />
      </div>
      <div>
        <label>Комиссия продажи (%)</label>
        <input type="number" id="sellFee" value="0" />
      </div>
    </div>

    <div class="form-group checkbox">
      <label><input type="checkbox" id="autoRate" /> Автоматический курс</label>
    </div>

    <button onclick="calculate()">Рассчитать</button>

    <div class="ad-banner">Реклама от Google<br><small>Благодаря рекламе приложение остаётся бесплатным</small></div>

    <div id="results"></div>
  </div>
  <script>
    function calculate() {
      const amount = parseFloat(document.getElementById("amount").value);
      const buyRate = parseFloat(document.getElementById("buyRate").value);
      const sellRate = parseFloat(document.getElementById("sellRate").value);
      const buyFee = parseFloat(document.getElementById("buyFee").value);
      const sellFee = parseFloat(document.getElementById("sellFee").value);

      if (isNaN(amount) || isNaN(buyRate) || isNaN(sellRate)) return;

      const spent = amount * buyRate;
      const received = amount * sellRate * (1 - sellFee / 100);
      const netProfit = received - spent;
      const spread = ((sellRate - buyRate) / buyRate) * 100;
      const spreadWithFee = ((sellRate * (1 - sellFee / 100) - buyRate * (1 + buyFee / 100)) / (buyRate * (1 + buyFee / 100))) * 100;

      document.getElementById("results").innerHTML = `
        <p>Курс покупки: <span>${buyRate.toFixed(2)}</span></p>
        <p>Курс продажи: <span>${sellRate.toFixed(2)}</span></p>
        <p>Спред без комиссии: <span>${spread.toFixed(2)}%</span></p>
        <p>Спред с комиссией: <span>${spreadWithFee.toFixed(2)}%</span></p>
        <p>Потрачено: <span>${spent.toFixed(2)}</span></p>
        <p>Получено: <span>${received.toFixed(2)}</span></p>
        <p>Чистая прибыль: <span>${netProfit.toFixed(2)}</span></p>
      `;
    }
  </script>
</body>
</html>
