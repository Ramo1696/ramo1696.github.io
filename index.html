<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Terminal</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="exchange-rate.js"></script>
</head>
<body>
<div id="container">

  <div class="header">
    <h1 id="title">P2P Terminal</h1>
    <button id="language-toggle" onclick="switchLanguage()">EN</button>
  </div>

  <!-- Калькулятор -->
  <section id="calculator" class="card">
    <h2>Калькулятор прибыли</h2>

    <div class="form-group">
      <label id="label-crypto">Криптовалюта</label>
      <select id="crypto"></select>
    </div>

    <div class="form-group">
      <label id="label-fiat">Фиат</label>
      <select id="fiat"></select>
    </div>

    <div class="form-group">
      <label id="label-amount">Сумма (в криптовалюте)</label>
      <input type="number" id="amount" placeholder="например, 1000" />
    </div>

    <div class="form-group">
      <label id="label-buy">Курс покупки</label>
      <input type="number" id="buyRate" step="any" />
    </div>

    <div class="form-group">
      <label id="label-sell">Курс продажи</label>
      <input type="number" id="sellRate" step="any" />
    </div>

    <div class="form-group">
      <label id="label-buyFee">Комиссия покупки (%)</label>
      <input type="number" id="buyFee" value="0" />
    </div>

    <div class="form-group">
      <label id="label-sellFee">Комиссия продажи (%)</label>
      <input type="number" id="sellFee" value="0" />
    </div>

    <div class="form-group">
      <label id="label-auto">
        <input type="checkbox" id="autoRate" /> Автоматический курс
      </label>
    </div>

    <button onclick="calculateProfit()">Рассчитать</button>

    <div id="results" class="results-box">
      <p id="buyRateResult"></p>
      <p id="sellRateResult"></p>
      <p id="spreadNoFee"></p>
      <p id="spreadWithFee"></p>
      <p id="spent"></p>
      <p id="received"></p>
      <p id="netProfit"></p>
    </div>
  </section>

  <!-- Таблица -->
  <section id="rates" class="card">
    <h2>Сравнение курсов P2P</h2>
    <table>
      <thead>
        <tr>
          <th>Платформа</th>
          <th>Покупка USDT</th>
          <th>Продажа USDT</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Telegram Market</td>
          <td>2.75 GEL</td>
          <td>2.82 GEL</td>
        </tr>
        <tr>
          <td>Binance P2P</td>
          <td>2.74 GEL</td>
          <td>2.81 GEL</td>
        </tr>
        <tr>
          <td>Bybit</td>
          <td>2.76 GEL</td>
          <td>2.83 GEL</td>
        </tr>
      </tbody>
    </table>
  </section>

</div>
</body>
</html>
