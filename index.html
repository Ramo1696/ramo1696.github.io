<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Profit</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <script defer src="exchange-rate.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(reg => console.log('✅ Service Worker registered', reg))
        .catch(err => console.error('❌ Service Worker registration failed', err));
    }
  </script>
</head>

<body>
  <div id="container">
    <h1>P2P Profit</h1>

    <div class="form-group">
      <label>Криптовалюта</label>
      <select id="crypto">
        <option value="tether">USDT</option>
        <option value="usd-coin">USDC</option>
        <option value="bitcoin">BTC</option>
        <option value="ethereum">ETH</option>
      </select>
    </div>

    <div class="form-group">
      <label>Фиат</label>
      <select id="fiat">
        <option value="gel">GEL</option>
        <option value="usd">USD</option>
        <option value="eur">EUR</option>
        <option value="rub">RUB</option>
      </select>
    </div>

    <div class="form-group">
      <label>Сумма (в криптовалюте)</label>
      <input type="number" id="amount" placeholder="например, 1000" />
    </div>

    <div class="form-group">
      <label>Курс покупки</label>
      <input type="number" id="buyRate" step="any" />
    </div>

    <div class="form-group">
      <label>Курс продажи</label>
      <input type="number" id="sellRate" step="any" />
    </div>

    <div class="form-group">
      <label>Комиссия покупки (%)</label>
      <input type="number" id="buyFee" value="0" />
    </div>

    <div class="form-group">
      <label>Комиссия продажи (%)</label>
      <input type="number" id="sellFee" value="0" />
    </div>

    <div class="form-group auto-rate">
      <label><input type="checkbox" id="autoRate" /> Автоматический курс</label>
    </div>

    <button onclick="calculateProfit()">Рассчитать</button>

    <div id="results" class="results-box">
      <p id="buyRateResult"></p>
      <p id="sellRateResult"></p>
      <p id="spreadNoFee"></p>
      <p id="spreadWithFee"></p>
      <p id="spent"></p>
      <p id="received"></p>
      <p id="netProfit"></p>
    </div>

    <!-- Adsterra Banner -->
    <div id="ad-banner" style="text-align: center; margin-top: 20px;">
      <script type="text/javascript">
        try {
          atOptions = {
            'key' : 'df07925319c8e4c444520d15490dd3f5',
            'format' : 'iframe',
            'height' : 250,
            'width' : 300,
            'params' : {}
          };
          var adScript = document.createElement('script');
          adScript.src = '//www.highperformanceformat.com/df07925319c8e4c444520d15490dd3f5/invoke.js';
          adScript.async = true;
          document.getElementById('ad-banner').appendChild(adScript);
        } catch (e) {
          console.warn('🚫 Ошибка загрузки рекламы:', e);
        }
      </script>
      <noscript>
        <div style="color: white;">Реклама недоступна (включите JavaScript)</div>
      </noscript>
    </div>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XE5ZMJ4SQ3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XE5ZMJ4SQ3');
    </script>
  </div>
</body>
</html>
