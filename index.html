<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Profit</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="exchange-rate.js"></script>
</head>
<body>
  <!-- Заставка -->
  <div id="splash-screen">
    <img src="logo.png" alt="Logo" class="splash-logo" />
    <h1>P2P Profit</h1>
  </div>

  <!-- Интерфейс -->
  <div id="container" style="display: none;">
    <div class="top-bar">
      <button id="lang-toggle">ENG</button>
    </div>

    <h1 data-i18n="title">P2P Profit</h1>

    <label data-i18n="crypto">Криптовалюта</label>
    <select id="crypto">
      <option value="tether">USDT</option>
      <option value="usd-coin">USDC</option>
      <option value="bitcoin">BTC</option>
      <option value="ethereum">ETH</option>
    </select>

    <label data-i18n="fiat">Фиат</label>
    <select id="fiat">
      <option value="gel">GEL</option>
      <option value="usd">USD</option>
      <option value="eur">EUR</option>
      <option value="rub">RUB</option>
    </select>

    <label data-i18n="amount">Сумма</label>
    <input type="number" id="amount" />

    <label data-i18n="buy-rate">Курс покупки</label>
    <input type="number" id="buyRate" />

    <label data-i18n="sell-rate">Курс продажи</label>
    <input type="number" id="sellRate" />

    <label data-i18n="buy-fee">Комиссия покупки (%)</label>
    <input type="number" id="buyFee" value="0" />

    <label data-i18n="sell-fee">Комиссия продажи (%)</label>
    <input type="number" id="sellFee" value="0" />

    <label><input type="checkbox" id="autoRate" /> <span data-i18n="auto">Авто курс</span></label>

    <button id="calculate" data-i18n="calc">Рассчитать</button>

    <div id="result"></div>
  </div>
</body>
</html>
