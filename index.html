<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P2P Profit</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="exchange-rate.js"></script>
</head>
<body class="dark">
  <div id="top-bar">
    <button id="theme-toggle">☀️</button>
    <h1 id="title">P2P Profit</h1>
    <button id="lang-toggle">Eng</button>
  </div>

  <div id="container">
    <label id="label-crypto">Криптовалюта</label>
    <select id="crypto">
      <option value="tether">USDT</option>
      <option value="usd-coin">USDC</option>
      <option value="bitcoin">BTC</option>
      <option value="ethereum">ETH</option>
    </select>

    <label id="label-fiat">Фиат</label>
    <select id="fiat">
      <option value="gel">GEL</option>
      <option value="usd">USD</option>
      <option value="eur">EUR</option>
      <option value="rub">RUB</option>
    </select>

    <label id="label-amount">Сумма (в криптовалюте)</label>
    <input id="amount" type="number" placeholder="например, 1000" />

    <label id="label-buy">Курс покупки</label>
    <input id="buyRate" type="number" />

    <label id="label-sell">Курс продажи</label>
    <input id="sellRate" type="number" />

    <label id="label-buy-fee">Комиссия покупки (%)</label>
    <input id="buyFee" type="number" value="0" />

    <label id="label-sell-fee">Комиссия продажи (%)</label>
    <input id="sellFee" type="number" value="0" />

    <div class="checkbox-group">
      <input type="checkbox" id="autoRate" />
      <label for="autoRate" id="label-auto">Автоматический курс</label>
    </div>

    <button id="calculate">Рассчитать</button>

    <div class="ad-label">
      <p id="ad-title">Реклама от Google</p>
      <p id="ad-sub">Благодаря рекламе приложение остаётся бесплатным</p>
    </div>

    <div id="results"></div>
  </div>
</body>
</html>
